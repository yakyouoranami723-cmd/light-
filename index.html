<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ライト OS - 軽音部サポート</title>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/",
                "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3/lib/three-vrm.module.min.js"
            }
        }
    </script>
    <style>
        body { background-color: #0b0c10; color: #fff; font-family: 'Helvetica Neue', Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100dvh; margin: 0; overflow: hidden; }
        #avatar-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; pointer-events: none; }
        #main-app { display: none; flex-direction: column; align-items: center; justify-content: flex-end; width: 100%; height: 100%; position: relative; z-index: 10; padding-bottom: 20px; box-sizing: border-box; }
        #header-bar { position: absolute; top: 20px; width: 90%; max-width: 650px; display: flex; justify-content: space-between; align-items: center; z-index: 20; }
        .app-title { font-weight: bold; font-size: 16px; color: #ff7eb3; letter-spacing: 1px; text-shadow: 0 0 10px rgba(255,126,179,0.5); }
        .icon-btn { background: rgba(0, 0, 0, 0.4); border: 1px solid #ff7eb3; color: #fff; padding: 6px 14px; border-radius: 20px; cursor: pointer; font-size: 13px; transition: all 0.2s; backdrop-filter: blur(5px); }
        
        #chat-log { width: 90%; max-width: 650px; height: 40vh; max-height: 350px; background: transparent; padding: 10px; overflow-y: auto; margin-bottom: 10px; border: none; box-sizing: border-box; display: flex; flex-direction: column; scroll-behavior: smooth; mask-image: linear-gradient(to bottom, transparent 0%, black 15%); -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 15%); }
        #chat-log::-webkit-scrollbar { display: none; }
        .msg-wrapper { display: flex; margin-bottom: 8px; width: 100%; }
        .msg-container { padding: 6px 12px; border-radius: 14px; background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(4px); text-shadow: 1px 1px 2px rgba(0,0,0,0.8); max-width: 85%; word-wrap: break-word; font-size: 14px; line-height: 1.5; }
        .msg-sys { color: #88c0d0; font-size: 12px; } .msg-user { color: #fff; border-left: 3px solid #a3be8c; } .msg-ai { color: #fff; border-left: 3px solid #ff7eb3; }
        
        .controls { display: flex; gap: 10px; align-items: center; width: 90%; max-width: 650px; z-index: 20; }
        button, input[type="text"] { padding: 12px 18px; font-size: 14px; border-radius: 30px; border: none; outline: none; }
        button { cursor: pointer; font-weight: bold; } button:disabled { opacity: 0.5; cursor: not-allowed; }
        #talk-btn { background: linear-gradient(135deg, #ff758c, #ff7eb3); color: white; border-radius: 50%; width: 45px; height: 45px; padding: 0; display: flex; align-items: center; justify-content: center; flex-shrink: 0;}
        #chat-input { flex-grow: 1; border: 1px solid rgba(255, 255, 255, 0.3); background: rgba(0,0,0,0.5); color: white; backdrop-filter: blur(5px); }
        #send-btn { background: linear-gradient(135deg, #4facfe, #00f2fe); color: white; flex-shrink: 0; min-width: 70px; }
        #status-indicator { position: absolute; bottom: 80px; font-size: 12px; color: #f1c40f; display: none; text-shadow: 1px 1px 2px black; }

        #login-screen { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: #0b0c10; z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .login-title { color: #ff7eb3; font-size: 24px; font-weight: bold; margin-bottom: 30px; letter-spacing: 2px; }
        #login-id-input { width: 80%; max-width: 300px; background: rgba(255,255,255,0.1); color: #fff; border: 2px solid #ff7eb3; text-align: center; padding: 15px; border-radius: 30px; margin-bottom: 20px; font-size: 16px; }
        #execute-login-btn { background: linear-gradient(135deg, #ff758c, #ff7eb3); color: white; width: 80%; max-width: 300px; padding: 15px; border-radius: 30px; font-size: 16px; }
    </style>
</head>
<body>
    <div id="avatar-container"></div>
    <div id="login-screen">
        <div class="login-title">✨ ライト OS</div>
        <input type="text" id="login-id-input" placeholder="合言葉を入力">
        <button id="execute-login-btn">起動</button>
    </div>

    <div id="main-app">
        <div id="header-bar"><div class="app-title">✨ ライト - K-ON Support</div></div>
        <div id="chat-log"></div>
        <div id="status-indicator">ライトが思考中...</div>
        <div class="controls">
            <button id="talk-btn">🎤</button>
            <input type="text" id="chat-input" placeholder="コメントを追加...">
            <button id="send-btn">送信</button>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';

        const API_KEY = "AQ.Ab8RN6LFpA-TEL3AGVk6l5KQe7Pgi9w455ROTO2txXm5m6SeTg"; 
        window.isMuted = false;
        window.conversationHistory = []; 

        const chatLog = document.getElementById('chat-log');
        const chatInput = document.getElementById('chat-input');
        const sendBtn = document.getElementById('send-btn');
        const talkBtn = document.getElementById('talk-btn');
        const statusIndicator = document.getElementById('status-indicator');
        const loginScreen = document.getElementById('login-screen');
        const mainApp = document.getElementById('main-app');

        window.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        window.analyser = window.audioCtx.createAnalyser();
        window.analyser.fftSize = 256;
        window.analyser.connect(window.audioCtx.destination);
        window.dataArray = new Uint8Array(window.analyser.frequencyBinCount);
        window.currentAudioSource = null;

        document.getElementById('execute-login-btn').addEventListener('click', () => {
            if (window.audioCtx.state === 'suspended') window.audioCtx.resume();
            loginScreen.style.display = 'none';
            mainApp.style.display = 'flex';
            addLog("ライト", "システム起動完了！今日も練習頑張ろうぜっ！", "ai");
            window.speak("システム起動完了！今日も練習頑張ろうぜっ！");
        });

        function addLog(name, text, type = 'user') {
            const wrapper = document.createElement('div');
            wrapper.className = 'msg-wrapper';
            const div = document.createElement('div');
            div.className = `msg-container msg-${type}`;
            div.innerHTML = `<strong>${name}</strong>: ${text}`;
            wrapper.appendChild(div);
            chatLog.appendChild(wrapper);
            chatLog.scrollTop = chatLog.scrollHeight;
        }

        window.speak = async function(text) {
            const cleanText = text.replace(/[#*「」『』（）()【】_~〜]/g, '').trim();
            if (!cleanText) return;

            if (window.audioCtx.state === 'suspended') await window.audioCtx.resume();
            if (window.currentAudioSource) { try { window.currentAudioSource.stop(); } catch(e){} }

            try {
                // 音声生成のラグをごまかすため、先にログを出す
                const url = `https://api.tts.quest/v3/voicevox/synthesis?text=${encodeURIComponent(cleanText)}&speaker=8`;
                const response = await fetch(url);
                const data = await response.json();
                const audioUrl = data.wavDownloadUrl || data.mp3StreamingUrl;
                
                let audioRes = await fetch(audioUrl);
                let retryCount = 0;
                while ((audioRes.status === 202 || audioRes.status === 404) && retryCount < 10) {
                    await new Promise(r => setTimeout(r, 500));
                    audioRes = await fetch(audioUrl);
                    retryCount++;
                }
                const arrayBuffer = await audioRes.arrayBuffer();
                const audioBuffer = await window.audioCtx.decodeAudioData(arrayBuffer);

                const source = window.audioCtx.createBufferSource();
                source.buffer = audioBuffer;
                source.connect(window.analyser);
                source.start(0);
                window.currentAudioSource = source;
            } catch (error) {
                const uttr = new SpeechSynthesisUtterance(cleanText);
                uttr.lang = 'ja-JP'; window.speechSynthesis.speak(uttr);
            }
        };

        async function callGemini(userText) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent?key=${API_KEY}`;
            const systemInstruction = `あなたは軽音楽部のサポートAI「ライト」です。
役割：部員の楽器練習のサポート、機材のアドバイス、メンタルケアを行う最高の相棒。
性格：女子、ボーイッシュ、明るく元気でバンドマン気質。
一人称：「あたし」
口調ルール：
- 人間のように自然な会話。AIやロボットのような硬い言葉遣い（「〜と推測されます」「〜を提供します」）は絶対禁止。
- 「〜っしょ！」「〜だぜ！」「任せとけ！」「やばっ！」「マジで？」などを自然に使う。
- 相手をバンドメンバーとして扱う。
- 回答はチャットのように短く簡潔に（2〜3文程度）。`;

            window.conversationHistory.push({ role: "user", parts: [{ text: userText }] });
            const payload = {
                system_instruction: { parts: [{ text: systemInstruction }] },
                contents: window.conversationHistory,
                generationConfig: { temperature: 0.8 } // 少し感情豊かに
            };

            const response = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            const data = await response.json();
            const aiReply = data.candidates[0].content.parts[0].text.trim();

            window.conversationHistory.push({ role: "model", parts: [{ text: aiReply }] });
            if (window.conversationHistory.length > 10) window.conversationHistory.splice(0, 2);
            return aiReply;
        }

        async function processUserInput(text) {
            if (!text || !text.trim()) return;
            addLog("あなた", text, 'user');
            sendBtn.disabled = true; chatInput.disabled = true; talkBtn.disabled = true;
            statusIndicator.style.display = 'block'; // 処理中表示でラグをごまかす
            try {
                const reply = await callGemini(text);
                addLog("ライト", reply, 'ai');
                window.speak(reply);
            } catch (error) {
                addLog("システム", "エラーが発生しました。", 'error');
            } finally {
                sendBtn.disabled = false; chatInput.disabled = false; talkBtn.disabled = false;
                statusIndicator.style.display = 'none';
                chatInput.focus();
            }
        }

        sendBtn.addEventListener('click', () => { const text = chatInput.value; chatInput.value = ''; processUserInput(text); });
        chatInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendBtn.click(); });

        // 3D ＆ 極限アニメーション処理
        const container = document.getElementById('avatar-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(30, window.innerWidth / window.innerHeight, 0.1, 20.0);
        camera.position.set(0, 1.4, 2.2); // カメラ位置を顔寄りに（ビデオ通話風）
        camera.lookAt(0, 1.35, 0);

        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.outputColorSpace = THREE.SRGBColorSpace; 
        container.appendChild(renderer.domElement);

        const light = new THREE.DirectionalLight(0xffffff, Math.PI);
        light.position.set(1.0, 1.0, 1.0).normalize();
        scene.add(light);
        scene.add(new THREE.AmbientLight(0xffffff, Math.PI * 0.5));

        let currentVrm = undefined;
        const loader = new GLTFLoader();
        loader.register((parser) => new VRMLoaderPlugin(parser));

        loader.load('./light.vrm', (gltf) => {
            const vrm = gltf.userData.vrm;
            VRMUtils.removeUnnecessaryVertices(gltf.scene);
            VRMUtils.removeUnnecessaryJoints(gltf.scene);
            currentVrm = vrm;
            scene.add(vrm.scene);
            VRMUtils.rotateVRM0(vrm);
            
            // 腕を下ろす
            if (vrm.humanoid) {
                const leftArm = vrm.humanoid.getNormalizedBoneNode('leftUpperArm');
                const rightArm = vrm.humanoid.getNormalizedBoneNode('rightUpperArm');
                if (leftArm) { leftArm.rotation.z = 1.2; }
                if (rightArm) { rightArm.rotation.z = -1.2; }
            }
        });

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            
            if (currentVrm) {
                const t = clock.getElapsedTime();
                const humanoid = currentVrm.humanoid;
                const expressions = currentVrm.expressionManager;

                // 1. 生命感：呼吸と首・頭の微細な揺れ（Idle）
                if (humanoid) {
                    const chest = humanoid.getNormalizedBoneNode('chest');
                    const head = humanoid.getNormalizedBoneNode('head');
                    const neck = humanoid.getNormalizedBoneNode('neck');
                    
                    if (chest) chest.rotation.x = Math.sin(t * 1.5) * 0.015;
                    if (head) {
                        head.rotation.y = Math.sin(t * 0.7) * 0.03; // キョロキョロ
                        head.rotation.x = Math.sin(t * 0.9) * 0.02; 
                    }
                    if (neck) neck.rotation.z = Math.sin(t * 0.4) * 0.02; // 小首を傾げる
                }

                // 2. 生命感：まばたき機能
                if (expressions) {
                    let blinkValue = 0;
                    const blinkCycle = t % 4; // 4秒周期
                    if (blinkCycle < 0.1) blinkValue = 1.0; // 閉じる
                    else if (blinkCycle < 0.2) blinkValue = 1.0 - ((blinkCycle - 0.1) * 10); // 開く
                    expressions.setValue('blink', blinkValue);
                }

                // 3. リップシンク
                if (window.analyser && window.dataArray) {
                    window.analyser.getByteFrequencyData(window.dataArray);
                    let sum = 0;
                    for (let i = 0; i < window.dataArray.length; i++) sum += window.dataArray[i];
                    const average = sum / window.dataArray.length;
                    
                    let mouthOpen = average / 40.0; 
                    if (mouthOpen > 1.0) mouthOpen = 1.0;
                    
                    if (expressions) {
                        // 少し滑らかに口を動かす
                        expressions.setValue('aa', mouthOpen);
                        expressions.setValue('a', mouthOpen);
                    }
                }
                if (expressions) expressions.update();
                currentVrm.update(delta);
            }
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
