<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ライト OS v8.6 Cloud</title>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/",
                "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3/lib/three-vrm.module.min.js"
            }
        }
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <style>
        body { background-color: #0b0c10; color: #fff; font-family: 'Helvetica Neue', Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100dvh; margin: 0; overflow: hidden; }
        #avatar-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; pointer-events: none; }
        
        #main-app { display: none; flex-direction: column; align-items: center; justify-content: flex-end; width: 100%; height: 100%; position: relative; z-index: 10; padding-bottom: 20px; box-sizing: border-box; }
        #header-bar { position: absolute; top: 20px; width: 90%; max-width: 650px; display: flex; justify-content: space-between; align-items: center; z-index: 20; }
        .app-title { font-weight: bold; font-size: 16px; color: #ff7eb3; letter-spacing: 1px; text-shadow: 0 0 10px rgba(255,126,179,0.5); }
        .icon-btn { background: rgba(0, 0, 0, 0.4); border: 1px solid #ff7eb3; color: #fff; padding: 6px 14px; border-radius: 20px; cursor: pointer; font-size: 13px; transition: all 0.2s; backdrop-filter: blur(5px); }
        .icon-btn:hover { background: rgba(255, 126, 179, 0.6); }

        #chat-log { 
            width: 90%; max-width: 650px; height: 40vh; max-height: 350px; 
            background: transparent; padding: 10px; overflow-y: auto; margin-bottom: 10px; 
            border: none; box-shadow: none; font-size: 14px; line-height: 1.5; box-sizing: border-box; 
            display: flex; flex-direction: column; scroll-behavior: smooth;
            mask-image: linear-gradient(to bottom, transparent 0%, black 15%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 15%);
        }
        #chat-log::-webkit-scrollbar { display: none; }

        .msg-wrapper { display: flex; margin-bottom: 8px; width: 100%; }
        .msg-container { padding: 6px 12px; border-radius: 14px; background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(4px); text-shadow: 1px 1px 2px rgba(0,0,0,0.8); max-width: 85%; word-wrap: break-word; }
        .msg-sys { color: #88c0d0; font-size: 12px; } 
        .msg-user { color: #fff; border-left: 3px solid #a3be8c; } 
        .msg-ai { color: #fff; border-left: 3px solid #ff7eb3; }
        .msg-ai strong { color: #ff7eb3; }
        .msg-user strong { color: #a3be8c; }
        .msg-error { color: #bf616a; font-weight: bold; background: rgba(191, 97, 106, 0.3); }

        .controls { display: flex; gap: 10px; align-items: center; width: 90%; max-width: 650px; z-index: 20; }
        button, input[type="text"] { padding: 12px 18px; font-size: 14px; border-radius: 30px; border: none; outline: none; transition: all 0.2s ease; }
        button { cursor: pointer; font-weight: bold; } button:hover { transform: translateY(-2px); } button:active { transform: translateY(1px); } button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        #talk-btn { background: linear-gradient(135deg, #ff758c, #ff7eb3); color: white; box-shadow: 0 4px 15px rgba(255, 117, 140, 0.4); flex-shrink: 0; border-radius: 50%; width: 45px; height: 45px; padding: 0; display: flex; align-items: center; justify-content: center; }
        #chat-input { flex-grow: 1; border: 1px solid rgba(255, 255, 255, 0.3); background: rgba(0,0,0,0.5); color: white; backdrop-filter: blur(5px); }
        #send-btn { background: linear-gradient(135deg, #4facfe, #00f2fe); color: white; box-shadow: 0 4px 15px rgba(79, 172, 254, 0.4); flex-shrink: 0; min-width: 70px; }
        
        #settings-modal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(5px); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: #161823; border: 1px solid #ff7eb3; border-radius: 16px; width: 85%; max-width: 420px; padding: 20px; box-shadow: 0 0 30px rgba(255, 126, 179, 0.3); max-height: 90vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 10px; margin-bottom: 15px; }
        .modal-title { font-size: 16px; font-weight: bold; color: #ff7eb3; }
        .close-btn { background: none; border: none; color: #aaa; font-size: 20px; cursor: pointer; padding: 0; }
        .setting-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-size: 14px; }
        .modal-btn { width: 100%; background: rgba(255, 255, 255, 0.05); border: 1px solid #4facfe; color: #4facfe; padding: 10px; border-radius: 8px; margin-top: 8px; font-size: 13px; }
        .section-title { font-size: 12px; color: #88c0d0; margin-top: 20px; margin-bottom: 5px; border-bottom: 1px dashed #88c0d0; padding-bottom: 3px; }
        .sync-box { background: rgba(241, 196, 15, 0.1); border: 1px solid #f1c40f; padding: 10px; border-radius: 8px; margin-bottom: 10px; }
        #sync-id-input { width: 100%; box-sizing: border-box; background: rgba(0,0,0,0.5); color: #f1c40f; border: 1px solid #f1c40f; text-align: center; font-weight: bold; letter-spacing: 2px; border-radius: 5px; padding: 8px; margin-bottom: 8px; }
        .sync-btn { background: #f1c40f; color: #000; width: 100%; border-radius: 5px; padding: 8px; border: none; font-weight: bold; cursor: pointer; }
        
        #login-screen { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: #0b0c10; z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .login-title { color: #ff7eb3; font-size: 24px; font-weight: bold; margin-bottom: 10px; letter-spacing: 2px; }
        .login-desc { color: #ccc; font-size: 14px; margin-bottom: 30px; }
        #login-id-input { width: 80%; max-width: 300px; background: rgba(255,255,255,0.1); color: #fff; border: 2px solid #ff7eb3; text-align: center; font-weight: bold; letter-spacing: 2px; padding: 15px; border-radius: 30px; margin-bottom: 20px; font-size: 16px; }
        #execute-login-btn { background: linear-gradient(135deg, #ff758c, #ff7eb3); color: white; width: 80%; max-width: 300px; padding: 15px; border-radius: 30px; font-size: 16px; margin-bottom: 30px; box-shadow: 0 4px 15px rgba(255, 117, 140, 0.4); }
        #forgot-login-btn { background: transparent; border: 1px solid #88c0d0; color: #88c0d0; padding: 10px 20px; border-radius: 20px; font-size: 12px; }
    </style>
</head>
<body>

    <div id="avatar-container"></div>

    <div id="login-screen">
        <div class="login-title">✨ ライト OS</div>
        <div class="login-desc">合言葉（パスワード）を入力</div>
        <input type="text" id="login-id-input" placeholder="合言葉を入力">
        <button id="execute-login-btn">起動</button>
        <div style="margin-bottom: 10px; color: #666; font-size: 12px;">または</div>
        <button id="forgot-login-btn">自分専用の合言葉を作る（新規）</button>
    </div>

    <div id="main-app">
        <div id="header-bar">
            <div class="app-title">✨ ライト</div>
            <button id="open-settings-btn" class="icon-btn">⚙️ 設定</button>
        </div>
        <div id="chat-log"></div>
        <div class="controls">
            <button id="talk-btn">🎤</button>
            <input type="text" id="chat-input" placeholder="コメントを追加...">
            <button id="send-btn">送信</button>
        </div>
    </div>

    <div id="settings-modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">⚙️ システム設定</div>
                <button class="close-btn" id="close-settings-btn">✖</button>
            </div>
            <div class="setting-row">
                <span>ボイス再生（音声）</span>
                <button id="mute-toggle-btn" class="icon-btn" style="border-color: #bf616a;">🔇 音声 OFF</button>
            </div>
            <div class="section-title">☁️ クラウド記憶同期 (合言葉)</div>
            <div class="sync-box">
                <div style="font-size: 11px; color: #ccc; margin-bottom: 8px;">合言葉を共有すると記憶が同期されます。</div>
                <input type="text" id="sync-id-input" placeholder="合言葉を入力">
                <button id="sync-execute-btn" class="sync-btn">手動で同期する</button>
            </div>
            <div class="section-title">【現在の学習ステータス】</div>
            <div class="setting-row" style="flex-direction: column; align-items: flex-start; margin-bottom: 5px;">
                <span id="brain-status-text" style="font-size: 13px;">自己改善: 0 | 個人記憶: 0 | 部活共有: 0</span>
            </div>
            <button id="view-brain-btn" class="modal-btn">🧠 記憶データの中身を確認 / リセット</button>
            <div class="section-title">【拡張知識】</div>
            <button id="pdf-btn" class="modal-btn">📄 説明書(PDF)を一時記憶させる</button>
            <input type="file" id="pdf-upload" accept="application/pdf" style="display: none;">
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';

        const firebaseConfig = {
            apiKey: "AIzaSyChocv7osIDAf9z4b1cVcab74b15Xzoudo",
            authDomain: "light-65413.firebaseapp.com",
            projectId: "light-65413",
            storageBucket: "light-65413.firebasestorage.app",
            messagingSenderId: "116819261632",
            appId: "1:116819261632:web:9d9144aa125a55371d5525"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const API_KEY = "AQ.Ab8RN6LFpA-TEL3AGVk6l5KQe7Pgi9w455ROTO2txXm5m6SeTg"; 

        window.isMuted = true;
        window.selfReflections = [];
        window.userFacts = [];
        window.globalFacts = [];
        window.pdfKnowledge = ""; 
        window.conversationHistory = []; 
        let myUserId = "";
        const GLOBAL_CLUB_ID = "shout_club_global_space";

        const chatLog = document.getElementById('chat-log');
        const chatInput = document.getElementById('chat-input');
        const sendBtn = document.getElementById('send-btn');
        const talkBtn = document.getElementById('talk-btn');
        const settingsModal = document.getElementById('settings-modal');
        const loginScreen = document.getElementById('login-screen');
        const mainApp = document.getElementById('main-app');

        const savedId = localStorage.getItem('light_sync_id');
        document.getElementById('login-id-input').value = savedId || "shout";

        // ==========================================
        // リップシンク用 Web Audio API セットアップ
        // ==========================================
        window.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        window.analyser = window.audioCtx.createAnalyser();
        window.analyser.fftSize = 256;
        window.analyser.connect(window.audioCtx.destination);
        window.dataArray = new Uint8Array(window.analyser.frequencyBinCount);
        window.currentAudioSource = null;

        function unlockAudio() {
            if ('speechSynthesis' in window) {
                const dummy = new SpeechSynthesisUtterance('');
                dummy.volume = 0;
                window.speechSynthesis.speak(dummy);
            }
            if (window.audioCtx.state === 'suspended') {
                window.audioCtx.resume();
            }
        }

        document.getElementById('execute-login-btn').addEventListener('click', () => {
            const inputId = document.getElementById('login-id-input').value.trim();
            if (!inputId) { alert("合言葉を入力してね！"); return; }
            myUserId = inputId;
            localStorage.setItem('light_sync_id', myUserId);
            document.getElementById('sync-id-input').value = myUserId;
            unlockAudio();
            loginScreen.style.display = 'none';
            mainApp.style.display = 'flex';
            loadAllData(myUserId);
        });

        document.getElementById('forgot-login-btn').addEventListener('click', () => {
            myUserId = 'shout-' + Math.random().toString(36).substr(2, 6).toLowerCase();
            localStorage.setItem('light_sync_id', myUserId);
            document.getElementById('sync-id-input').value = myUserId;
            alert(`あなた専用の合言葉を作成しました！\n\n【 ${myUserId} 】`);
            unlockAudio();
            loginScreen.style.display = 'none';
            mainApp.style.display = 'flex';
            loadAllData(myUserId);
        });

        function updateUI() {
            document.getElementById('brain-status-text').textContent = 
                `自己改善: ${window.selfReflections.length} | 個人記憶: ${window.userFacts.length} | 部活共有: ${window.globalFacts.length}`;
        }

        function addLog(name, text, type = 'user') {
            const wrapper = document.createElement('div');
            wrapper.className = 'msg-wrapper';
            const div = document.createElement('div');
            div.className = `msg-container msg-${type}`;
            div.innerHTML = `<strong>${name}</strong>: ${text}`;
            wrapper.appendChild(div);
            chatLog.appendChild(wrapper);
            chatLog.scrollTop = chatLog.scrollHeight;
        }

        async function loadAllData(userId) {
            try {
                addLog("システム", `クラウド連携待機中...`, "sys");
                const userDocSnap = await getDoc(doc(db, "light_memories", userId));
                if (userDocSnap.exists()) {
                    const data = userDocSnap.data();
                    window.selfReflections = data.reflections || [];
                    window.userFacts = data.facts || [];
                }
                const globalDocSnap = await getDoc(doc(db, "light_memories", GLOBAL_CLUB_ID));
                if (globalDocSnap.exists()) {
                    window.globalFacts = globalDocSnap.data().globalFacts || [];
                }
                addLog("システム", "データ同期完了！ライト アクティベート。", "sys");
                const msg = "よっ！";
                addLog("ライト", msg, "ai");
                window.speak(msg);
                updateUI();
            } catch (e) {
                console.error(e);
                addLog("システム", "クラウドとの通信に失敗しました。", "error");
            }
        }

        async function saveUserToCloud() {
            try {
                await setDoc(doc(db, "light_memories", myUserId), {
                    reflections: window.selfReflections,
                    facts: window.userFacts,
                    updatedAt: new Date()
                });
            } catch (e) { console.error(e); }
        }

        async function saveGlobalToCloud() {
            try {
                await setDoc(doc(db, "light_memories", GLOBAL_CLUB_ID), {
                    globalFacts: window.globalFacts,
                    updatedAt: new Date()
                });
            } catch (e) { console.error(e); }
        }

        document.getElementById('sync-execute-btn').addEventListener('click', () => {
            const newId = document.getElementById('sync-id-input').value.trim();
            if (!newId) return;
            myUserId = newId;
            localStorage.setItem('light_sync_id', myUserId);
            loadAllData(myUserId);
            settingsModal.style.display = 'none';
        });

        document.getElementById('open-settings-btn').addEventListener('click', () => settingsModal.style.display = 'flex');
        document.getElementById('close-settings-btn').addEventListener('click', () => settingsModal.style.display = 'none');

        const muteBtn = document.getElementById('mute-toggle-btn');
        muteBtn.addEventListener('click', () => {
            window.isMuted = !window.isMuted;
            if(window.isMuted) {
                muteBtn.textContent = "🔇 音声 OFF";
                muteBtn.style.borderColor = "#bf616a";
                if (window.currentAudioSource) window.currentAudioSource.stop();
                window.speechSynthesis.cancel();
            } else {
                muteBtn.textContent = "🔊 音声 ON";
                muteBtn.style.borderColor = "#ff7eb3";
                if (window.audioCtx.state === 'suspended') window.audioCtx.resume();
            }
        });

        document.getElementById('view-brain-btn').addEventListener('click', async () => {
            let msg = "【部活全体の共有知識】\n" + (window.globalFacts.length ? "・" + window.globalFacts.join("\n・") : "(なし)");
            msg += "\n\n【個人の記憶データ】\n" + (window.userFacts.length ? "・" + window.userFacts.join("\n・") : "(なし)");
            if(confirm(msg + "\n\n※個人の記憶をクリアしますか？")) {
                window.selfReflections = [];
                window.userFacts = [];
                await saveUserToCloud();
                updateUI();
                addLog("システム", "個人の記憶をクリアしました。", "sys");
            }
        });

        // ==========================================
        // リップシンク対応 音声再生関数
        // ==========================================
        window.speak = async function(text) {
            if (window.isMuted) return;
            window.speechSynthesis.cancel();
            const cleanText = text.replace(/[#*「」『』（）()【】_~〜]/g, '').trim();
            if (!cleanText) return;

            if (window.audioCtx.state === 'suspended') await window.audioCtx.resume();
            if (window.currentAudioSource) {
                try { window.currentAudioSource.stop(); } catch(e){}
            }

            // VoiceVox API (無料・高品質)
            const url = `https://api.tts.quest/v3/voicevox/synthesis?text=${encodeURIComponent(cleanText)}&speaker=8`;

            try {
                // 音声データをバイナリとして取得し、AudioContextで解析＆再生
                const response = await fetch(url);
                if (!response.ok) throw new Error("VoiceVox Error");
                const arrayBuffer = await response.arrayBuffer();
                const audioBuffer = await window.audioCtx.decodeAudioData(arrayBuffer);

                const source = window.audioCtx.createBufferSource();
                source.buffer = audioBuffer;
                
                // リップシンク用のアナライザーに接続
                source.connect(window.analyser);
                source.start(0);
                window.currentAudioSource = source;
            } catch (error) {
                console.warn("高品質音声の取得に失敗。ブラウザ音声にフォールバックします。", error);
                const uttr = new SpeechSynthesisUtterance(cleanText);
                uttr.lang = 'ja-JP'; uttr.rate = 1.1; uttr.pitch = 1.3; 
                window.speechSynthesis.speak(uttr);
            }
        };

        async function callGemini(userText) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent?key=${API_KEY}`;
            const rulesContext = window.selfReflections.length > 0 ? "\n【過去の反省】\n・" + window.selfReflections.join("\n・") : "";
            const factsContext = window.userFacts.length > 0 ? "\n【個人記憶】\n・" + window.userFacts.join("\n・") : "";
            const globalContext = window.globalFacts.length > 0 ? "\n【部活共有知識】\n・" + window.globalFacts.join("\n・") : "";

            const systemInstruction = `あなたはユーザーの相棒「電キャ」の「ライト」です。
性別：女子（ボーイッシュで明るく元気な性格）一人称：「あたし」
基本口調：「〜っしょ！」「〜だぜ！」「任せとけ！」
${rulesContext}
${factsContext}
${globalContext}
${window.pdfKnowledge}
【メタタグ規則】個人情報は [FACT: 内容]、部活共有知識は [GLOBAL: 内容] を末尾に付与。`;

            window.conversationHistory.push({ role: "user", parts: [{ text: userText }] });
            const payload = {
                system_instruction: { parts: [{ text: systemInstruction }] },
                contents: window.conversationHistory,
                generationConfig: { temperature: 0.7, topP: 0.95 }
            };

            const response = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            if (!response.ok) throw new Error("通信エラー");

            const data = await response.json();
            let aiReply = data.candidates[0].content.parts[0].text;

            let userMemoryChanged = false, globalMemoryChanged = false;
            const factMatches = [...aiReply.matchAll(/\[FACT:\s*(.*?)\]/g)];
            for (const m of factMatches) { if (!window.userFacts.includes(m[1].trim())) { window.userFacts.push(m[1].trim()); userMemoryChanged = true; } }
            const globalMatches = [...aiReply.matchAll(/\[GLOBAL:\s*(.*?)\]/g)];
            for (const m of globalMatches) { if (!window.globalFacts.includes(m[1].trim())) { window.globalFacts.push(m[1].trim()); globalMemoryChanged = true; } }

            aiReply = aiReply.replace(/【?\s*\[(REFLECT|FACT|GLOBAL):\s*.*?\]\s*】?/g, '').trim();
            updateUI();
            if (userMemoryChanged) saveUserToCloud();
            if (globalMemoryChanged) saveGlobalToCloud();

            window.conversationHistory.push({ role: "model", parts: [{ text: aiReply }] });
            if (window.conversationHistory.length > 20) window.conversationHistory.splice(0, 2);
            return aiReply;
        }

        async function processUserInput(text) {
            if (!text || !text.trim()) return;
            addLog("あなた", text, 'user');
            sendBtn.disabled = true; chatInput.disabled = true; talkBtn.disabled = true;
            try {
                const reply = await callGemini(text);
                addLog("ライト", reply, 'ai');
                window.speak(reply);
            } catch (error) {
                window.conversationHistory.pop();
                addLog("システム", error.message, 'error');
            } finally {
                sendBtn.disabled = false; chatInput.disabled = false; talkBtn.disabled = false;
                chatInput.focus();
            }
        }

        sendBtn.addEventListener('click', () => { const text = chatInput.value; chatInput.value = ''; processUserInput(text); });
        chatInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendBtn.click(); });

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.lang = 'ja-JP';
            talkBtn.addEventListener('click', () => { try { recognition.start(); } catch(e){} });
            recognition.onresult = (e) => processUserInput(e.results[0][0].transcript);
        } else { talkBtn.style.display = 'none'; }

        // ==========================================
        // 3D レンダリング処理 & リップシンクアニメーション
        // ==========================================
        const container = document.getElementById('avatar-container');
        const scene = new THREE.Scene();
        
        const camera = new THREE.PerspectiveCamera(30, window.innerWidth / window.innerHeight, 0.1, 20.0);
        camera.position.set(0, 0.9, 2.5); 
        camera.lookAt(0, 0.9, 0);

        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.outputColorSpace = THREE.SRGBColorSpace; 
        container.appendChild(renderer.domElement);

        const light = new THREE.DirectionalLight(0xffffff, Math.PI);
        light.position.set(1.0, 1.0, 1.0).normalize();
        scene.add(light);
        const ambientLight = new THREE.AmbientLight(0xffffff, Math.PI * 0.5);
        scene.add(ambientLight);

        let currentVrm = undefined;
        const loader = new GLTFLoader();
        loader.register((parser) => new VRMLoaderPlugin(parser));

        loader.load(
            './light.vrm', 
            (gltf) => {
                const vrm = gltf.userData.vrm;
                if (!vrm) return;
                VRMUtils.removeUnnecessaryVertices(gltf.scene);
                VRMUtils.removeUnnecessaryJoints(gltf.scene);
                currentVrm = vrm;
                scene.add(vrm.scene);
                VRMUtils.rotateVRM0(vrm);

                if (vrm.humanoid) {
                    const leftArm = vrm.humanoid.getNormalizedBoneNode('leftUpperArm');
                    const rightArm = vrm.humanoid.getNormalizedBoneNode('rightUpperArm');
                    const leftLowerArm = vrm.humanoid.getNormalizedBoneNode('leftLowerArm');
                    const rightLowerArm = vrm.humanoid.getNormalizedBoneNode('rightLowerArm');
                    const leftHand = vrm.humanoid.getNormalizedBoneNode('leftHand');
                    const rightHand = vrm.humanoid.getNormalizedBoneNode('rightHand');
                    
                    if (leftArm) { leftArm.rotation.z = 1.15; leftArm.rotation.x = 0.1; }
                    if (rightArm) { rightArm.rotation.z = -1.15; rightArm.rotation.x = 0.1; }
                    if (leftLowerArm) leftLowerArm.rotation.x = -0.15;
                    if (rightLowerArm) rightLowerArm.rotation.x = -0.15;
                    if (leftHand) leftHand.rotation.x = -0.1;
                    if (rightHand) rightHand.rotation.x = -0.1;
                }
            },
            undefined,
            (error) => addLog("システム", "light.vrmの読み込みに失敗しました。", "error")
        );

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            
            if (currentVrm) {
                // 呼吸運動
                const t = clock.getElapsedTime();
                const chest = currentVrm.humanoid.getNormalizedBoneNode('chest');
                if (chest) chest.rotation.x = Math.sin(t * 2) * 0.02;

                // ★ リップシンク（音声波形から口の開き具合を計算）
                if (window.analyser && window.dataArray) {
                    window.analyser.getByteFrequencyData(window.dataArray);
                    let sum = 0;
                    for (let i = 0; i < window.dataArray.length; i++) {
                        sum += window.dataArray[i];
                    }
                    const average = sum / window.dataArray.length;
                    
                    // 音量を 0.0〜1.0 の口の開き具合に変換（感度調整：数値を下げると口が大きく開く）
                    let mouthOpen = average / 40.0; 
                    if (mouthOpen > 1.0) mouthOpen = 1.0;
                    
                    // VRMの口（あ行）の形に適用
                    if (currentVrm.expressionManager) {
                        currentVrm.expressionManager.setValue('aa', mouthOpen);
                        currentVrm.expressionManager.update();
                    }
                }

                currentVrm.update(delta);
            }
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
