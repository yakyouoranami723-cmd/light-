<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-width=1.0">
    <title>AIアシスタント「ライト」</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase Compat SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-100 h-screen flex flex-col">

    <!-- ヘッダー -->
    <header class="bg-blue-600 text-white p-4 shadow-md flex items-center justify-between">
        <h1 class="text-xl font-bold">🤖 ライト (AIアシスタント)</h1>
        <span id="status" class="text-xs bg-yellow-400 text-black px-2 py-1 rounded-full">準備中...</span>
    </header>

    <!-- チャット表示エリア -->
    <main id="chat-box" class="flex-1 overflow-y-auto p-4 space-y-4 bg-gray-50"></main>

    <!-- 入力エリア -->
    <footer class="bg-white p-3 shadow-[0_-2px_10px_rgba(0,0,0,0.05)] flex items-center gap-2">
        <label for="image-upload" class="cursor-pointer text-gray-500 hover:text-blue-600 transition p-2">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" d="M18.375 12.739l-7.693 7.693a4.536 4.536 0 01-6.42-6.421l10.899-10.899m-7.81 8.19l-2.741 2.741a1.986 1.986 0 002.808 2.808l2.741-2.74m6.364-6.364l-2.741-2.741a1.986 1.986 0 00-2.808-2.808l2.741 2.741" /></svg>
        </label>
        <input type="file" id="image-upload" accept="image/*" class="hidden">
        
        <div id="image-preview" class="hidden relative">
            <img id="preview-img" class="h-10 w-10 object-cover rounded border border-gray-300">
            <button onclick="removeImage()" class="absolute -top-2 -right-2 bg-red-500 text-white rounded-full w-4 h-4 flex items-center justify-center text-xs">×</button>
        </div>

        <input type="text" id="user-input" class="flex-1 border border-gray-300 rounded-full px-4 py-2 focus:outline-none focus:border-blue-500" placeholder="ライトに質問する...">
        <button id="send-btn" class="bg-blue-600 text-white rounded-full p-2 hover:bg-blue-700 transition">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" d="M6 12L3.269 3.126A59.768 59.768 0 0121.485 12 59.77 59.77 0 013.27 20.876L5.999 12zm0 0h7.5" /></svg>
        </button>
    </footer>

    <script>
        // --- 1. 設定情報 (書き換えてください) ---
        const firebaseConfig = {
            apiKey: "YOUR_FIREBASE_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };
        const GEMINI_API_KEY = "YOUR_GEMINI_API_KEY";
        const GEMINI_MODEL = "gemini-1.5-flash"; // 画像認識対応

        // --- 2. 初期化 ---
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        let currentSystemPrompt = "あなたは親切なAIアシスタントです。";
        let base64Image = null;
        let mimeType = null;

        // --- 3. Firebaseからルール読み込み ---
        db.collection("settings").doc("systemPrompt").onSnapshot((doc) => {
            if (doc.exists) {
                currentSystemPrompt = doc.data().text;
                document.getElementById('status').innerText = "接続完了";
                document.getElementById('status').className = "text-xs bg-green-400 text-white px-2 py-1 rounded-full";
            }
        });

        // --- 4. UI関連の関数 ---
        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const imageUpload = document.getElementById('image-upload');
        const previewDiv = document.getElementById('image-preview');
        const previewImg = document.getElementById('preview-img');

        function addMessage(text, sender, imageUrl = null) {
            const div = document.createElement('div');
            div.className = `flex ${sender === 'user' ? 'justify-end' : 'justify-start'}`;
            let innerHTML = `<div class="max-w-[75%] rounded-2xl p-3 ${sender === 'user' ? 'bg-blue-500 text-white rounded-br-none' : 'bg-white text-gray-800 shadow rounded-bl-none border border-gray-200'}">`;
            
            if (imageUrl) {
                innerHTML += `<img src="${imageUrl}" class="w-32 h-auto rounded mb-2">`;
            }
            innerHTML += `<p class="whitespace-pre-wrap text-sm">${text}</p></div>`;
            div.innerHTML = innerHTML;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // --- 5. 画像添付の処理 ---
        imageUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                const dataUrl = event.target.result;
                previewImg.src = dataUrl;
                previewDiv.classList.remove('hidden');
                // Data URL (data:image/jpeg;base64,/9j...) から Base64部分とMIMEを抽出
                const split = dataUrl.split(',');
                mimeType = split[0].match(/:(.*?);/)[1];
                base64Image = split[1];
            };
            reader.readAsDataURL(file);
        });

        function removeImage() {
            base64Image = null;
            mimeType = null;
            imageUpload.value = '';
            previewDiv.classList.add('hidden');
        }

        // --- 6. 送信＆Gemini API通信 ---
        document.getElementById('send-btn').addEventListener('click', async () => {
            const text = userInput.value.trim();
            if (!text && !base64Image) return;

            // UI反映
            const tempImgUrl = base64Image ? previewImg.src : null;
            addMessage(text || "（画像送信）", 'user', tempImgUrl);
            userInput.value = '';
            removeImage();

            // Gemini APIのリクエストボディ作成
            const contents = [];
            if (base64Image) {
                contents.push({ inline_data: { mime_type: mimeType, data: base64Image } });
            }
            if (text) {
                contents.push({ text: text });
            }

            const requestBody = {
                system_instruction: { parts: [{ text: currentSystemPrompt }] },
                contents: [{ parts: contents }]
            };

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${GEMINI_API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(requestBody)
                });
                
                const data = await response.json();
                const aiText = data.candidates[0].content.parts[0].text;
                addMessage(aiText, 'ai');

                // Firebaseに会話ログを保存
                db.collection("chatLogs").add({
                    timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                    userText: text,
                    aiText: aiText,
                    hasImage: tempImgUrl !== null
                });

            } catch (error) {
                console.error(error);
                addMessage("エラーが発生しました。通信環境を確認してください。", 'ai');
            }
        });

        // Enterキーで送信
        userInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter") document.getElementById('send-btn').click();
        });
    </script>
</body>
</html>
