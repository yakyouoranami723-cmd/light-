<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ライト 管理者ダッシュボード</title>
    <!-- Tailwind CSS for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDK (Compat v9) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen">

    <!-- ヘッダー -->
    <header class="bg-indigo-600 text-white shadow">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold">💡 ライト 管理者ダッシュボード</h1>
            <span id="connection-status" class="text-xs bg-indigo-500 px-3 py-1 rounded-full">接続確認中...</span>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8 space-y-8">

        <!-- 📊 ダッシュボード・統計カードセクション -->
        <section class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-white p-6 rounded-xl shadow border border-gray-100">
                <p class="text-sm font-medium text-gray-500">総会話ログ数</p>
                <p id="stat-total-logs" class="text-3xl font-bold text-indigo-600 mt-2">-</p>
            </div>
            <div class="bg-white p-6 rounded-xl shadow border border-gray-100">
                <p class="text-sm font-medium text-gray-500">現在のシステム設定</p>
                <p id="stat-current-mode" class="text-lg font-semibold text-gray-700 mt-2 truncate">読み込み中...</p>
            </div>
            <div class="bg-white p-6 rounded-xl shadow border border-gray-100">
                <p class="text-sm font-medium text-gray-500">ステータス</p>
                <p class="text-lg font-semibold text-emerald-600 mt-2">正常稼働中 🟢</p>
            </div>
        </section>

        <!-- ⚙️ プロンプト（ルール）編集セクション -->
        <section class="bg-white p-6 rounded-xl shadow border border-gray-100">
            <h2 class="text-lg font-bold text-gray-700 mb-4">ライトの性格・ルールの変更（共通プロンプト）</h2>
            <p class="text-sm text-gray-500 mb-3">ここに記述した内容が、部員側アプリのライトの挙動にリアルタイムで反映されます。</p>
            <textarea id="prompt-input" rows="4" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none font-mono text-sm" placeholder="ルールを入力..."></textarea>
            <div class="mt-4 flex justify-end">
                <button onclick="savePrompt()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-6 py-2 rounded-lg shadow transition">
                    ルールを保存して適用
                </button>
            </div>
        </section>

        <!-- 💬 会話履歴確認セクション -->
        <section class="bg-white p-6 rounded-xl shadow border border-gray-100">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-bold text-gray-700">生徒との会話履歴</h2>
                <button onclick="loadLogs()" class="text-sm text-indigo-600 hover:underline">🔄 履歴を更新</button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-100 text-xs text-gray-600 uppercase">
                            <th class="p-3">日時</th>
                            <th class="p-3">ユーザーの質問</th>
                            <th class="p-3">ライトの返答</th>
                        </tr>
                    </thead>
                    <tbody id="logs-table-body" class="divide-y divide-gray-200 text-sm">
                        <tr>
                            <td colspan="3" class="p-4 text-center text-gray-400">履歴を読み込んでいます...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <!-- Firebase設定 & ロジック -->
    <script>
        // -----------------------------------------------------------------
        // ⚠️ ご自身のFirebase設定（プロジェクトに合わせて書き換えてください）
        // -----------------------------------------------------------------
        const firebaseConfig = {
            apiKey: "YOUR_FIREBASE_API_KEY",
            authDomain: "YOUR_FIREBASE_AUTH_DOMAIN",
            projectId: "YOUR_FIREBASE_PROJECT_ID",
            storageBucket: "YOUR_FIREBASE_STORAGE_BUCKET",
            messagingSenderId: "YOUR_FIREBASE_MESSAGING_SENDER_ID",
            appId: "YOUR_FIREBASE_APP_ID"
        };

        // Firebase初期化
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // 接続確認表示の更新
        document.getElementById('connection-status').textContent = "Firebase接続完了";
        document.getElementById('connection-status').className = "text-xs bg-emerald-500 px-3 py-1 rounded-full text-white";

        // プロンプト（ルール）を読み込む
        async function loadPrompt() {
            try {
                const doc = await db.collection("settings").doc("systemPrompt").get();
                if (doc.exists) {
                    const text = doc.data().text || "";
                    document.getElementById('prompt-input').value = text;
                    document.getElementById('stat-current-mode').textContent = text.substring(0, 20) + (text.length > 20 ? '...' : '');
                } else {
                    document.getElementById('stat-current-mode').textContent = "未設定";
                }
            } catch (e) {
                console.error("プロンプト読み込みエラー:", e);
            }
        }

        // プロンプトを保存する
        async function savePrompt() {
            const text = document.getElementById('prompt-input').value;
            try {
                await db.collection("settings").doc("systemPrompt").set({ text: text });
                alert("ルールを更新しました！部員側のアプリに反映されます。");
                loadPrompt();
            } catch (e) {
                alert("保存に失敗しました: " + e.message);
            }
        }

        // 会話履歴と統計データを読み込む
        async function loadLogs() {
            const tbody = document.getElementById('logs-table-body');
            tbody.innerHTML = '<tr><td colspan="3" class="p-4 text-center text-gray-400">読み込み中...</td></tr>';

            try {
                const snapshot = await db.collection("chatLogs").orderBy("timestamp", "desc").limit(20).get();
                
                // ダッシュボードの総会話数を更新
                document.getElementById('stat-total-logs').textContent = snapshot.size + (snapshot.size >= 20 ? "件以上" : "件");

                if (snapshot.empty) {
                    tbody.innerHTML = '<tr><td colspan="3" class="p-4 text-center text-gray-400">まだ会話履歴がありません。</td></tr>';
                    return;
                }

                tbody.innerHTML = "";
                snapshot.forEach(doc => {
                    const data = doc.data();
                    const dateStr = data.timestamp ? new Date(data.timestamp.toDate()).toLocaleString() : "日時不明";
                    
                    const tr = document.createElement('tr');
                    tr.className = "hover:bg-gray-50";
                    tr.innerHTML = `
                        <td class="p-3 text-xs text-gray-500 whitespace-nowrap">${dateStr}</td>
                        <td class="p-3 font-medium text-gray-800">${escapeHtml(data.user || "")}</td>
                        <td class="p-3 text-gray-600">${escapeHtml(data.ai || "")}</td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (e) {
                tbody.innerHTML = `<tr><td colspan="3" class="p-4 text-center text-red-500">履歴の取得に失敗しました（インデックス未作成の可能性があります）</td></tr>`;
                console.error(e);
            }
        }

        // HTMLエスケープ（セキュリティ対策）
        function escapeHtml(str) {
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }

        // ページ読み込み時に実行
        window.onload = () => {
            loadPrompt();
            loadLogs();
        };
    </script>
</body>
</html>
